name: Bug report
description: The Hue Bridge, Hue Light or Hue Scene driver does something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you paste anything, **replace your LAN addresses
        (the bridge's, the controller's) and the bridge id with placeholders**, for
        example `10.0.2.143` for the bridge, `192.0.2.20` for the controller and
        `001788fffe123abc` for the bridge id. The driver never shows the Hue
        application key; **never paste one**. If you think you have found a security
        problem, do not open an issue: see `SECURITY.md`.

        Click **Test Connection** on the Hue Bridge device first and check chapter 12
        of the manual (the Documentation tab of the Hue Bridge device), which lists
        every text the properties can show and what to do about it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did (a Composer action, a Navigator tile, a keypad, the Hue app, ...) and what the driver did. Steps to reproduce if you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: c4-os
    attributes:
      label: Control4 OS version
      description: The controller's OS version as Composer Pro reports it.
      placeholder: "3.4.2"
    validations:
      required: true
  - type: input
    id: composer
    attributes:
      label: Composer Pro version
      placeholder: "3.4.2"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Driver build number
      description: The **Driver Version** property of the Hue Bridge device (an integer; the Releases page says which release it belongs to). Say so if the Hue Light or Hue Scene devices show a different number.
      placeholder: "228"
    validations:
      required: true
  - type: dropdown
    id: bridge-model
    attributes:
      label: Bridge model
      description: The **Bridge Model** property of the Hue Bridge device.
      options:
        - Hue Bridge Pro (BSB003)
        - Hue Bridge v2, square (BSB002)
        - Other, or not paired yet (say what Bridge Model shows)
    validations:
      required: true
  - type: textarea
    id: properties
    attributes:
      label: Status, Event Stream, Attention and Last Action
      description: The texts of the Hue Bridge device's **Status**, **Event Stream**, **Attention** and **Last Action** properties (with **Last Action (2)** to **(6)** when shown), and the **Status** of the Hue Light or Hue Scene device concerned. Copy them as they are; they are written to be read.
      render: text
    validations:
      required: true
  - type: textarea
    id: lua-output
    attributes:
      label: Lua output
      description: Set **Debug Mode** to On on the device (Properties tab, then the row's Set button), reproduce the problem, paste the relevant lines of the device's Lua tab in Composer, and set Debug Mode back to Off. Addresses and the bridge id replaced; no application key.
      render: text
  - type: checkboxes
    id: private-data
    attributes:
      label: Private data
      options:
        - label: I replaced LAN addresses and the bridge id with placeholders and did not paste an application key.
          required: true
