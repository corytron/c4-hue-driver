# OpenSSF Scorecard (docs/cicd-gitops-design.md, section 4.5): scores the
# repository's supply-chain practices (pinned actions, token permissions,
# branch protection, signed releases, dependency updates, ...) on every push to
# main, when a branch protection rule changes, and once a week. The results are
# published to the Scorecard API, which feeds the badge in the README, and
# uploaded to code scanning on the Security tab. Read-only: it changes nothing.
# Scorecard's publishing rules shape this file: no workflow-level write
# permissions, no env blocks, and only its approved actions in the job.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC

permissions: {}

# One analysis at a time (Scorecard's publishing rules do not restrict this).
concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results to the Scorecard API (the badge)
      contents: read # read the repository
      actions: read # read the workflows and their runs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as a workflow artifact for five days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
