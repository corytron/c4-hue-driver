# Categories for GitHub's own "Generate release notes" button, by pull-request
# label (the labels .github/labels.json defines); Dependabot's pin updates are
# left out. The Release workflow does not use it: it writes every release's
# notes from CHANGELOG.md (tools/changelog.py notes, docs/changelog-design.md).
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Fixed
      labels:
        - bug
    - title: New and changed
      labels:
        - enhancement
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Tooling and CI
      labels:
        - ci
        - release
    - title: Other changes
      labels:
        - "*"
